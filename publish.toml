[site]
name = "sychostar"
url = "https://lihaoze-bob.github.io/"
repository = "LiHaoze-Bob/lihaoze-bob.github.io"
branch = "main"
theme = "pure"

[[sources]]
path = "30_Courses"
destination = "courses"

# Archived courses retain the same public hierarchy as active courses.
[[sources]]
path = "30_Courses/Archive"
destination = "courses"

# Archive is a storage folder. Both sources use the same public hierarchy.
[[sources]]
path = "50_Note"
destination = "knowledge"

[[sources]]
path = "50_Note/Archive"
destination = "knowledge"

[[sources]]
path = "40_Reading/Books"
destination = "reading/reading"

[[sources]]
path = "40_Reading/Papers"
destination = "reading/paper"

[[sources]]
path = "40_Reading/Articles"
destination = "reading/articles"

# Retain existing article URLs after the archive was flattened.
[legacy_directories]
"50_Note/Archive/Can I Run AI.md" = "knowledge/tech"
"50_Note/Archive/What to commit in Github.md" = "knowledge/tech"
"50_Note/Archive/IPA 自动续签.md" = "knowledge/tools"

# Historical labels keep category URLs stable; Pure displays Others via sections.json.
[labels]
knowledge = "Tech"
"knowledge/tech" = "技术积累"
"knowledge/tools" = "Tools"
reading = "Reading"
"reading/reading" = "Reading"
"reading/paper" = "Paper"
"reading/articles" = "Articles"
